name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: tests + build + gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # package.json tiene "type": "module", así que node --check parsea los archivos como ESM.
      - name: Chequeo de sintaxis de todos los módulos
        run: |
          set -e
          for f in js/*.js api/*.js; do
            node --check "$f"
            echo "OK $f"
          done

      - name: Tests (node --test)
        run: npm test

      - name: Build de producción
        run: npx vite build

      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
